<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | صرح الوليد للخدمات العقارية</title>
    <meta name="description" content="تسجيل دخول لوحة التحكم الخاصة بمؤسسة صرح الوليد للخدمات العقارية.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="Assets/images/logo image.png">
    <link rel="stylesheet" href="css/all.min.css">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body style="background-color: #eee;">
    <main class="container" style="max-width: 480px; margin-top: 8vh;">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <img src="Assets/images/logo image.png" alt="شعار صرح الوليد للخدمات العقارية"
                     class="d-block m-auto mb-3" style="max-width: 140px; height: auto;">
                <h1 class="h4 text-center fw-bold mb-4">تسجيل دخول لوحة التحكم</h1>

                <div id="loginStatus" hidden></div>

                <form id="loginForm" novalidate>
                    <div class="mb-3">
                        <label for="email" class="form-label fw-bold">البريد الإلكتروني</label>
                        <input type="email" class="form-control py-2" id="email" name="email"
                               autocomplete="username" required>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label fw-bold">كلمة المرور</label>
                        <input type="password" class="form-control py-2" id="password" name="password"
                               autocomplete="current-password" required>
                    </div>
                    <button type="submit" id="loginButton"
                            class="btn btn-success w-100 fw-bold py-2">دخول</button>
                </form>

                <p class="text-center mt-4 mb-0">
                    <a href="index.html" class="text-decoration-none">العودة إلى الصفحة الرئيسية</a>
                </p>
            </div>
        </div>
    </main>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
